<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Musique Spotify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #1db95430 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #1db95420 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, #1db95415 0%, transparent 50%);
      animation: bgPulse 6s ease-in-out infinite alternate;
      z-index: 0;
      transition: background 1s ease;
    }
    @keyframes bgPulse {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.05); }
    }

    /* Particles */
    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .particle {
      position: absolute;
      background: #1db954;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(29,185,84,0.25);
      border-radius: 24px;
      padding: 32px;
      width: 90%;
      max-width: 460px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(29,185,84,0.12), 0 20px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .header svg { width: 28px; height: 28px; flex-shrink: 0; }
    .header-title { font-size: 0.8rem; color: #1db954; text-transform: uppercase; letter-spacing: 1px; }

    /* Equalizer */
    .equalizer { display: flex; align-items: flex-end; gap: 3px; height: 18px; margin-left: auto; }
    .bar { width: 3px; background: #1db954; border-radius: 2px; animation: eq linear infinite; }
    .bar:nth-child(1) { animation-duration: 0.8s; }
    .bar:nth-child(2) { animation-duration: 0.6s; animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-duration: 1.0s; animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.05s; }
    .bar:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.15s; }
    @keyframes eq {
      0%, 100% { height: 3px; }
      50%       { height: 16px; }
    }
    .equalizer.paused .bar { animation-play-state: paused; height: 4px; }

    .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(29,185,84,0.4), transparent); margin-bottom: 24px; }

    /* Now playing */
    .now-playing {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 20px;
      min-height: 80px;
    }

    .album-art {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-shrink: 0;
      transition: all 0.4s ease;
      background: rgba(255,255,255,0.05);
    }
    .album-art.spinning {
      animation: spin 8s linear infinite;
    }
    @keyframes spin {
      from { border-radius: 50%; }
      to   { border-radius: 50%; transform: rotate(360deg); }
    }

    .track-info { flex: 1; overflow: hidden; }
    .track-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-album {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: #1db954;
      background: rgba(29,185,84,0.12);
      border: 1px solid rgba(29,185,84,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      margin-top: 8px;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: #1db954;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }
    .status-badge.paused .status-dot { animation: none; background: #888; }
    .status-badge.paused { color: #888; border-color: rgba(136,136,136,0.3); background: rgba(136,136,136,0.08); }

    /* Progress bar */
    .progress-wrap { margin-bottom: 8px; }
    .progress-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-bar-fill {
      height: 100%;
      background: #1db954;
      border-radius: 4px;
      transition: width 1s linear;
      width: 0%;
    }
    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      margin-top: 5px;
    }

    /* Idle state */
    .idle {
      text-align: center;
      padding: 20px 0;
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
    }
    .idle span { display: block; font-size: 2rem; margin-bottom: 8px; }

    /* Playlist embed */
    .playlist-section { margin-top: 20px; }
    .playlist-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .embed-wrapper { border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .embed-wrapper iframe { display: block; }

    /* Jam button */
    .jam-section {
      margin-top: 16px;
      display: none;
      animation: fadeIn 0.5s ease both;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .jam-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1db954, #17a349);
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(29,185,84,0.35);
    }
    .jam-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(29,185,84,0.5); }
    .jam-btn:active { transform: translateY(0); }
    .jam-pulse {
      width: 8px; height: 8px;
      background: #000;
      border-radius: 50%;
      animation: jamPulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes jamPulse {
      0%,100% { transform: scale(1); opacity:1; }
      50%      { transform: scale(1.6); opacity:0.6; }
    }

    .footer { margin-top: 16px; text-align: center; font-size: 0.72rem; color: rgba(255,255,255,0.2); }
    .footer a { color: #1db954; text-decoration: none; }
  </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="header">
    <svg viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
      <circle cx="84" cy="84" r="84" fill="#1db954"/>
      <path d="M120.8 117.4c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.5-3 .7-6-1.2-6.7-4.2-.7-3 1.2-6 4.2-6.7 33.7-7.7 62.6-4.4 86 9.8 2.6 1.6 3.4 5 1.9 7.8zm10.2-22.7c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60-18.8-88.1-10.3-3.6 1.1-7.4-1-8.5-4.6-1.1-3.6 1-7.4 4.6-8.5 32.1-9.7 72-5 99.2 11.8 3.2 2 4.2 6.2 2.2 9.4zm.9-23.6c-28.6-17-75.7-18.5-103-10.2-4.4 1.3-9-1.2-10.3-5.6-1.3-4.4 1.2-9 5.6-10.3 31.3-9.5 83.3-7.7 116.1 11.8 3.9 2.3 5.2 7.3 2.9 11.2-2.3 3.9-7.3 5.2-11.3 3.1z" fill="#fff"/>
    </svg>
    <span class="header-title">En ce moment</span>
    <div class="equalizer" id="eq">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Now playing section -->
  <div id="now-playing-section">
    <div class="now-playing" id="now-playing">
      <div class="idle"><span>🎵</span>Chargement...</div>
    </div>
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-times">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </div>

  <!-- Jam section -->
  <div class="jam-section" id="jam-section">
    <a id="jam-btn" class="jam-btn" href="#" target="_blank">
      <div class="jam-pulse"></div>
      🎧 Écouter avec moi — Rejoindre la Jam
    </a>
  </div>

  <!-- Playlist embed -->
  <div class="playlist-section">
    <div class="playlist-label">Ma playlist</div>
    <div class="embed-wrapper">
      <iframe
        src="https://open.spotify.com/embed/playlist/175s3EW7fqN1ODRg07wglf?utm_source=generator"
        width="100%" height="352" frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <div class="footer">Propulsé par <a href="https://spotify.com" target="_blank">Spotify</a></div>
</div>

<script>
  // Particles
  const pc = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `left:${Math.random()*100}vw;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*10}s`;
    pc.appendChild(p);
  }

  // Helpers
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }

  let progressMs = 0;
  let duration = 0;
  let isPlaying = false;
  let ticker = null;

  function startTicker() {
    clearInterval(ticker);
    ticker = setInterval(() => {
      if (!isPlaying) return;
      progressMs = Math.min(progressMs + 1000, duration);
      updateProgressUI();
    }, 1000);
  }

  function updateProgressUI() {
    const pct = duration > 0 ? (progressMs / duration) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('time-current').textContent = fmt(progressMs);
    document.getElementById('time-total').textContent = fmt(duration);
  }

  async function fetchNowPlaying() {
    try {
      const res = await fetch('/api/now-playing');
      const data = await res.json();
      render(data);
    } catch(e) {
      console.error(e);
    }
  }

  function render(data) {
    const np = document.getElementById('now-playing');
    const pw = document.getElementById('progress-wrap');
    const eq = document.getElementById('eq');

    if (!data.isPlaying && !data.title) {
      // Rien en cours
      np.innerHTML = `<div class="idle"><span>😴</span>Rien en écoute pour l'instant</div>`;
      pw.style.display = 'none';
      eq.classList.add('paused');
      return;
    }

    isPlaying = data.isPlaying;
    progressMs = data.progress;
    duration = data.duration;

    eq.classList.toggle('paused', !isPlaying);
    pw.style.display = 'block';
    updateProgressUI();
    startTicker();

    np.innerHTML = `
      <img class="album-art ${isPlaying ? 'spinning' : ''}" src="${data.albumArt}" alt="Album art" />
      <div class="track-info">
        <a href="${data.songUrl}" target="_blank" style="text-decoration:none">
          <div class="track-title">${data.title}</div>
        </a>
        <div class="track-artist">${data.artist}</div>
        <div class="track-album">${data.album}</div>
        <div class="status-badge ${isPlaying ? '' : 'paused'}">
          <div class="status-dot"></div>
          ${isPlaying ? 'En écoute' : 'En pause'}
        </div>
      </div>
    `;
  }

  // Poll toutes les 5 secondes
  fetchNowPlaying();
  setInterval(fetchNowPlaying, 5000);

  // Jam link
  async function fetchJam() {
    try {
      const res = await fetch('/api/jam');
      const { jamLink } = await res.json();
      const section = document.getElementById('jam-section');
      const btn = document.getElementById('jam-btn');
      if (jamLink) {
        btn.href = jamLink;
        section.style.display = 'block';
      } else {
        section.style.display = 'none';
      }
    } catch(e) {}
  }
  fetchJam();
  setInterval(fetchJam, 10000);
</script>

</body>
</html>
