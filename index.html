<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Musique Spotify</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #1db95430 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #1db95420 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, #1db95415 0%, transparent 50%);
      animation: bgPulse 6s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgPulse {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.05); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #1db954;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(29, 185, 84, 0.25);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 480px;
      width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(29, 185, 84, 0.12), 0 20px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .spotify-logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 0.82rem;
      color: #1db954;
      margin-top: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Equalizer bars animation */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      margin-left: auto;
    }

    .bar {
      width: 4px;
      background: #1db954;
      border-radius: 2px;
      animation: eq linear infinite;
    }

    .bar:nth-child(1) { animation-duration: 0.8s; animation-delay: 0s; }
    .bar:nth-child(2) { animation-duration: 0.6s; animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-duration: 1.0s; animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.05s; }
    .bar:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.15s; }

    @keyframes eq {
      0%, 100% { height: 4px; }
      50%       { height: 18px; }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(29,185,84,0.4), transparent);
      margin-bottom: 24px;
    }

    /* Embed wrapper */
    .embed-wrapper {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .embed-wrapper iframe {
      display: block;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.3px;
    }

    .footer span {
      color: #1db954;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="header">
      <!-- Spotify SVG logo -->
      <svg class="spotify-logo" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
        <circle cx="84" cy="84" r="84" fill="#1db954"/>
        <path d="M120.8 117.4c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.5-3 .7-6-1.2-6.7-4.2-.7-3 1.2-6 4.2-6.7 33.7-7.7 62.6-4.4 86 9.8 2.6 1.6 3.4 5 1.9 7.8zm10.2-22.7c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60-18.8-88.1-10.3-3.6 1.1-7.4-1-8.5-4.6-1.1-3.6 1-7.4 4.6-8.5 32.1-9.7 72-5 99.2 11.8 3.2 2 4.2 6.2 2.2 9.4zm.9-23.6c-28.6-17-75.7-18.5-103-10.2-4.4 1.3-9-1.2-10.3-5.6-1.3-4.4 1.2-9 5.6-10.3 31.3-9.5 83.3-7.7 116.1 11.8 3.9 2.3 5.2 7.3 2.9 11.2-2.3 3.9-7.3 5.2-11.3 3.1z" fill="#fff"/>
      </svg>
      <div class="header-text">
        <h1>Ma Playlist</h1>
        <p>Spotify · En écoute</p>
      </div>
      <div class="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="embed-wrapper">
      <iframe
        data-testid="embed-iframe"
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/175s3EW7fqN1ODRg07wglf?utm_source=generator"
        width="100%"
        height="352"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>

    <div class="footer">
      Propulsé par <span>Spotify</span> · Bonne écoute 🎵
    </div>
  </div>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
      p.style.opacity = Math.random() * 0.5;
      container.appendChild(p);
    }
  </script>

</body>
</html>
